services:
  - type: web
    name: telegram-ai-bot
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install python-telegram-bot uvicorn starlette opencv-python-headless numpy insightface onnxruntime Pillow
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
